[project]
name = "fastf1-mcp-server"
dynamic = ["version"]
description = "MCP server for Formula 1 data via FastF1"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "formula1", "f1", "fastf1", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastf1>=3.8.2,<4",
    "fastmcp>=3.2.0,<4",
    "pydantic-settings>=2.13.1,<3",
]

[project.scripts]
fastf1-mcp-server = "fastf1_mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Strip the leading "v" from tags like v0.2.0 → 0.2.0
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/fastf1_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastf1_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.3",
]
